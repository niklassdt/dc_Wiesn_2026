document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"bec05280-3997-411b-a215-af4ecf7d2933\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"52233394-8f12-4fdc-8787-d539f0f42525\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"53964f89-ff7f-4b2c-8ba6-fff735e1d6d4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"0223b624-5883-41fa-81fa-2fabb938111e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n:root {\n  --dc-black: #000000;\n  --dc-white: #ffffff;\n  --dc-lime: #D7FF24;\n  --dc-gray-700: #7F7F7F;\n  --dc-hairline: #E5E5E5;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml, body {\n  height: 100%;\n  margin: 0;\n  padding: 0;\n  background: var(--dc-white);\n  overflow: hidden;\n}\n\nbody {\n  font-family: \"Barlow Condensed\", system-ui, sans-serif;\n  font-weight: 300;\n  color: var(--dc-black);\n  -webkit-font-smoothing: antialiased;\n}\n\na { color: var(--dc-black); text-decoration: none; }\n\ncanvas { image-rendering: pixelated; display: block; touch-action: none; }\n\nbutton, input, textarea { font-family: inherit; }\n\ninput:focus, textarea:focus { outline: none; border-bottom-color: #4B23FF; }\n\n::placeholder { color: #BFBFBF; }\n\n::-webkit-scrollbar { width: 6px; height: 6px; }\n::-webkit-scrollbar-thumb { background: var(--dc-hairline); }\n::-webkit-scrollbar-track { background: transparent; }\n\n/* ---------- page shells ---------- */\n\n.page {\n  height: 100vh;\n  overflow: hidden;\n  display: grid;\n  background: var(--dc-white);\n}\n.page[hidden] { display: none; }\n\n.page--spiel {\n  grid-template-rows: auto minmax(0, 1fr);\n  padding: clamp(28px, 4vh, 56px) clamp(24px, 5vw, 80px) clamp(24px, 3.5vh, 48px);\n  gap: clamp(14px, 2vh, 32px);\n}\n\n.page--buchung {\n  grid-template-rows: auto minmax(0, 1fr);\n  padding: clamp(28px, 4vh, 56px) clamp(24px, 5vw, 80px) clamp(24px, 3.5vh, 48px);\n  gap: clamp(20px, 3vh, 40px);\n}\n\n.topbar {\n  display: flex;\n  justify-content: space-between;\n  align-items: flex-start;\n  gap: 40px;\n}\n.topbar__meta {\n  font-size: 11px;\n  letter-spacing: 0.08em;\n  text-transform: lowercase;\n  color: var(--dc-gray-700);\n  line-height: 1.6;\n}\n\n/* ---------- spiel: intro ---------- */\n\n.intro__title { display: flex; flex-direction: column; gap: 8px; }\n.intro__title h1 {\n  margin: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 0.15em;\n  font-weight: 300;\n  font-size: clamp(29px, min(3.1vw, 6vh), 52px);\n  line-height: 0.96;\n  letter-spacing: -0.015em;\n}\n.intro__line { display: block; }\n.intro__brezn { width: clamp(44px, 5.5vw, 80px); height: auto; display: block; image-rendering: pixelated; }\n.intro__body { margin: 0; max-width: 64ch; font-size: 17px; line-height: 1.28; }\n\n.divider { border: 0; border-top: 1px solid var(--dc-hairline); margin: 0; }\n\n/* ---------- spiel: two-column layout ---------- */\n\n.spiel-grid {\n  min-height: 0;\n  display: grid;\n  grid-template-columns: minmax(240px, 1fr) auto;\n  grid-template-rows: minmax(0, 1fr);\n  gap: clamp(24px, 3vw, 48px);\n  align-items: stretch;\n}\n\n.info-col {\n  display: grid;\n  /* 3fr/18fr/2fr mirror app.js's PAD_TOP_ROWS/H/PAD_BOTTOM_ROWS (3/18/2) — the\n     canvas's invisible-top / visible-playfield / invisible-bottom split — so\n     row 2 always matches the visible, colored part of the game-frame square,\n     not its full (padded) height. The trailing 22px + auto reproduce the old\n     fixed gap-to-logo(22px) + logo(its own height) below that, unchanged. */\n  grid-template-rows: 3fr 18fr 2fr 22px auto;\n  gap: 0;\n  min-height: 0;\n  overflow-x: hidden;\n  overflow-y: auto;\n  padding-right: 10px;\n}\n.info-col__content {\n  grid-row: 2;\n  display: flex;\n  flex-direction: column;\n  --content-gap: clamp(6px, 1vh, 14px);\n  gap: var(--content-gap);\n  min-height: 0;\n  overflow-y: auto;\n}\n/* pushes the divider (and everything after it, i.e. the whole stats block)\n   down to the bottom of info-col__content, which is sized to match the\n   game-frame's height exactly (see .info-col above) — i.e. aligns \"versuche\"\n   with the frame's bottom edge without any hardcoded, viewport-specific\n   offset. Sits on the divider rather than .stats so the divider stays\n   pinned directly above the stats block, not floating above it. */\n.info-col__content .divider { margin-top: auto; }\n/* cancels the flex `gap` above so the divider's distance to \"punkte\" comes\n   only from that row's own top padding — the same distance \"runde\" has to\n   the divider (border) above it. */\n.info-col__content .stats { margin-top: calc(-1 * var(--content-gap)); }\n.info-col__logo { grid-row: 5; height: 32px; width: auto; display: block; flex-shrink: 0; }\n\n.game-col {\n  display: grid;\n  grid-template-rows: minmax(0, 1fr) auto;\n  gap: 10px;\n  min-width: 0;\n  min-height: 0;\n  height: 100%;\n  overflow: hidden;\n  justify-items: start;\n  align-content: stretch;\n}\n\n.game-frame {\n  position: relative;\n  /* both axes derive from this one clamped value (via aspect-ratio below),\n     so the box is always exactly square — previously height:100% and\n     max-width:62vw were clamped independently, which could make the box\n     narrower than tall once max-width kicked in. The canvas is a fixed\n     square raster, so a non-square box let object-fit:contain letterbox\n     it, exposing this element's own dark background as a stray bar. */\n  height: min(100%, 62vw);\n  width: auto;\n  min-height: clamp(160px, 32vh, 300px);\n  overflow: hidden;\n  aspect-ratio: 1 / 1;\n  background: #1B120A;\n}\n.game-frame canvas { width: 100%; height: 100%; object-fit: contain; }\n\n.overlay {\n  position: absolute;\n  /* 3/23 and 2/23 mirror app.js's PAD_TOP_ROWS/H/PAD_BOTTOM_ROWS (3/18/2) —\n     the invisible white top/bottom margin added around the canvas — so the\n     overlay covers only the visible, checkered playfield, not that margin. */\n  top: 13.0435%;\n  bottom: 8.6957%;\n  left: 0;\n  right: 0;\n  background: rgba(10, 7, 4, 0.86);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: flex-start;\n  padding: clamp(14px, 4vh, 48px);\n  text-align: center;\n  overflow-y: auto;\n}\n.overlay[hidden] { display: none; }\n.overlay__inner {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: clamp(8px, 2vh, 22px);\n  width: 100%;\n  margin: auto 0;\n}\n.overlay__title {\n  font-family: \"Press Start 2P\", monospace;\n  font-size: 21px;\n  line-height: 1.5;\n  color: var(--dc-lime);\n  text-transform: uppercase;\n}\n.overlay__text {\n  font-family: \"Press Start 2P\", monospace;\n  font-size: 10px;\n  line-height: 2.1;\n  color: #F3EDE4;\n  max-width: 44ch;\n  width: 100%;\n  white-space: pre-line;\n}\n.overlay__actions {\n  display: flex;\n  gap: 14px;\n  flex-wrap: wrap;\n  justify-content: center;\n  margin-top: 6px;\n}\n\n.btn-pixel {\n  font-family: \"Press Start 2P\", monospace;\n  font-size: clamp(8px, 1.4vh, 11px);\n  color: #000;\n  background: var(--dc-lime);\n  border: 0;\n  border-radius: 0;\n  padding: 14px 22px;\n  cursor: pointer;\n}\n.btn-pixel:hover { background: var(--dc-white); }\n\n.btn-pixel--ghost {\n  color: #F3EDE4;\n  background: transparent;\n  border: 1px solid #F3EDE4;\n}\n.btn-pixel--ghost:hover { background: #F3EDE4; color: #000; }\n.btn-pixel--ghost[hidden] { display: none; }\n\n.controls-row {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 16px;\n  flex-wrap: wrap;\n  width: 100%;\n  min-width: 0;\n}\n.swipe-hint { display: none; font-size: 16px; letter-spacing: 0.04em; color: var(--dc-gray-700); }\n.dpad { display: flex; gap: 8px; }\n.dpad__btn {\n  width: 52px;\n  height: 44px;\n  border: 1px solid var(--dc-black);\n  background: var(--dc-white);\n  border-radius: 0;\n  font-size: 20px;\n  cursor: pointer;\n}\n.dpad__btn:hover { background: var(--dc-lime); }\n\n/* ---------- spiel: stats ---------- */\n\n.stats { display: flex; flex-direction: column; }\n.stats__row {\n  display: flex;\n  justify-content: space-between;\n  align-items: baseline;\n  padding: clamp(2px, 0.5vh, 6px) 0;\n  border-bottom: 1px solid var(--dc-hairline);\n}\n.stats__row--last { align-items: center; padding: 6px 0; border-bottom: none; }\n.stats__label { font-size: 16px; letter-spacing: 0.04em; color: var(--dc-black); height: 22px; }\n.stats__value { font-size: 26px; line-height: 1; }\n.stats__value--lives { display: flex; gap: 8px; align-items: center; }\n.life-heart { width: 36px; height: 36px; display: block; image-rendering: pixelated; }\n.life-heart.is-spent { opacity: 0.15; }\n\n.hl { background: var(--dc-lime); padding: 0 0.14em 0.05em; }\n\n.skip-to-booking {\n  width: 52px;\n  height: 44px;\n  border: 0;\n  background: var(--dc-white);\n  border-radius: 0;\n  padding: 0;\n  cursor: pointer;\n  flex-shrink: 0;\n}\n.skip-to-booking:hover { background: var(--dc-lime); }\n\n/* ---------- buchung ---------- */\n\n.buchung-layout {\n  min-height: 0;\n  overflow: hidden;\n  display: grid;\n  grid-template-columns: minmax(0, 0.72fr) minmax(320px, 1fr);\n  grid-template-rows: minmax(0, 1fr);\n  gap: clamp(40px, 6vw, 96px);\n  align-items: stretch;\n}\n\n.buchung-info {\n  display: grid;\n  /* trailing 22px + auto reproduce .info-col's own trailing rows on the\n     spiel page byte-for-byte (same fixed gap, same auto-height logo row)\n     so the logo lands at the exact same point on every page, regardless\n     of how tall this column's own content happens to be. */\n  grid-template-rows: minmax(0, 1fr) 22px auto;\n  gap: 0;\n  min-height: 0;\n  overflow-x: hidden;\n  overflow-y: auto;\n}\n.buchung-info__content {\n  grid-row: 1;\n  display: flex;\n  flex-direction: column;\n  gap: clamp(14px, 2.6vh, 32px);\n  min-height: 0;\n  overflow-y: auto;\n}\n/* matches .info-col__logo on the spiel page — same size, same\n   bottom-of-column placement, so the logo sits consistently across\n   all three pages (spiel, buchung, thankyou share this one column). */\n.buchung-info__logo { grid-row: 3; height: 32px; width: auto; display: block; flex-shrink: 0; }\n.buchung-info h1 {\n  margin: 0;\n  font-weight: 300;\n  font-size: clamp(38px, 4.6vw, 76px);\n  line-height: 0.96;\n  letter-spacing: -0.015em;\n}\n.link-muted {\n  align-self: flex-start;\n  display: inline-block;\n  font-size: 15px;\n  letter-spacing: 0.04em;\n  color: var(--dc-gray-700);\n  border-bottom: 1px solid var(--dc-hairline);\n  padding-bottom: 2px;\n  cursor: pointer;\n}\n.link-muted:hover { color: var(--dc-black); background: var(--dc-lime); }\n\n.detail-list {\n  border-top: 1px solid var(--dc-black);\n  padding-top: 20px;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  max-width: 38ch;\n}\n.detail-row { display: flex; gap: 24px; font-size: 20px; }\n.detail-label {\n  width: 11ch;\n  flex-shrink: 0;\n  color: var(--dc-gray-700);\n  font-size: 13px;\n  letter-spacing: 0.04em;\n  padding-top: 4px;\n}\n\n.buchung-info .link-muted { font-size: 22px; }\n.buchung-info .detail-row { font-size: 22px; }\n.buchung-info .detail-label { font-size: 16px; padding-top: 3px; }\n\n.buchung-form-col {\n  display: flex;\n  flex-direction: column;\n  gap: clamp(18px, 3vh, 36px);\n  min-height: 0;\n  overflow-x: hidden;\n  overflow-y: auto;\n  padding: 0 4px 4px 0;\n}\n\n.thankyou {\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  gap: 28px;\n  min-height: 100%;\n  flex-shrink: 0;\n  margin: auto 0;\n}\n.thankyou[hidden] { display: none; }\n.eyebrow { font-size: 13px; letter-spacing: 0.04em; color: var(--dc-gray-700); text-transform: lowercase; }\n.thankyou h2 {\n  margin: 0;\n  font-weight: 300;\n  font-size: clamp(38px, 4.4vw, 68px);\n  line-height: 0.98;\n  letter-spacing: -0.015em;\n}\n.thankyou p { margin: 0; max-width: 34ch; font-size: 22px; line-height: 1.36; white-space: pre-line; }\n.thankyou .detail-list { max-width: 36ch; font-size: 22px; }\n.thankyou .detail-row { font-size: 22px; }\n.thankyou .detail-label { font-size: 16px; padding-top: 3px; }\n.thankyou-actions { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; padding-top: 4px; }\n\n.btn-outline {\n  border: 1px solid var(--dc-black);\n  background: var(--dc-white);\n  color: var(--dc-black);\n  font-size: 22px;\n  padding: 12px 24px 14px;\n  border-radius: 0;\n  cursor: pointer;\n}\n.btn-outline:hover { background: var(--dc-lime); }\n.muted-note { font-size: 16px; color: var(--dc-gray-700); max-width: 26ch; line-height: 1.4; }\n\n.booking-form { display: flex; flex-direction: column; gap: clamp(18px, 3vh, 36px); }\n.booking-form[hidden] { display: none; }\n\n.field-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: clamp(16px, 2.4vh, 30px) 40px;\n}\n.field { display: flex; flex-direction: column; gap: 8px; }\n.field__label { font-size: 16px; letter-spacing: 0.04em; color: var(--dc-gray-700); }\n.field__label--lg { font-size: 22px; }\n.field input,\n.field textarea {\n  border: 0;\n  border-bottom: 1px solid var(--dc-black);\n  border-radius: 0;\n  background: transparent;\n  font-size: 22px;\n  font-weight: 300;\n  padding: 4px 0 8px;\n  color: var(--dc-black);\n  width: 100%;\n}\n.field textarea { font-size: 22px; padding: 6px 0 10px; resize: vertical; }\n\n.slots { display: flex; flex-direction: column; gap: 14px; }\n.slots__grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));\n  gap: 8px;\n}\n.slot-btn {\n  border: 1px solid var(--dc-hairline);\n  background: var(--dc-white);\n  color: var(--dc-black);\n  border-radius: 0;\n  font-size: 22px;\n  font-weight: 300;\n  padding: 12px 0 14px;\n  cursor: pointer;\n  letter-spacing: 0.01em;\n}\n.slot-btn.is-active { border-color: var(--dc-black); background: var(--dc-lime); }\n.slot-hint { font-size: 16px; color: var(--dc-gray-700); background: transparent; padding: 4px 8px; display: inline-block; }\n.slot-hint.is-warn { color: var(--dc-black); background: var(--dc-lime); }\n\n.submit-row {\n  display: flex;\n  align-items: center;\n  gap: 32px;\n  border-top: 1px solid var(--dc-black);\n  padding-top: 24px;\n  flex-wrap: wrap;\n}\n.btn-solid {\n  background: var(--dc-black);\n  color: var(--dc-white);\n  font-size: 22px;\n  letter-spacing: 0.02em;\n  padding: 14px 32px 16px;\n  border: 0;\n  border-radius: 0;\n  cursor: pointer;\n}\n.btn-solid:hover { background: var(--dc-lime); color: var(--dc-black); }\n.btn-solid:disabled { cursor: default; }\n.submit-summary { font-size: 13px; color: var(--dc-gray-700); max-width: 40ch; line-height: 1.4; }\n.submit-summary.is-error { color: var(--dc-black); }\n\n.disclaimer { font-size: 16px; color: var(--dc-gray-700); line-height: 1.45; width: 410px; max-width: 100%; }\n\n/* ---------- mobile (portrait) ----------\n   One column, game on top, copy + stats stacked underneath, page scrolls.\n   Steering is by swipe on the canvas (already bound), so the d-pad is\n   replaced by a short hint. */\n@media (max-width: 760px) {\n  html, body { overflow: visible; height: auto; }\n\n  .page {\n    height: auto;\n    min-height: 100dvh;\n    overflow: visible;\n    grid-template-rows: auto auto !important;\n  }\n  .page--spiel, .page--buchung {\n    padding: 20px 18px 36px;\n    gap: 18px;\n  }\n\n  /* spiel */\n  .spiel-grid {\n    grid-template-columns: minmax(0, 1fr);\n    grid-template-rows: auto auto;\n    gap: 22px;\n  }\n  .game-col {\n    order: -1;\n    height: auto;\n    overflow: visible;\n    justify-items: stretch;\n    grid-template-rows: auto auto;\n  }\n  .game-frame {\n    height: auto;\n    width: 100%;\n    min-height: 0;\n  }\n  .info-col {\n    display: block;\n    overflow: visible;\n    padding-right: 0;\n  }\n  .info-col__content { display: flex; overflow: visible; min-height: 0; }\n  .info-col__content .divider { margin-top: 20px; }\n  .info-col__content .stats { margin-top: 0; }\n  .info-col__logo { margin-top: 26px; }\n\n  .dpad { display: none; }\n  .swipe-hint { display: inline-block; }\n  .controls-row { gap: 12px; }\n\n  .intro__body { font-size: 16px; max-width: none; }\n  .stats__value { font-size: 22px; }\n  .life-heart { width: 30px; height: 30px; }\n\n  .overlay { padding: 14px 16px; }\n  .overlay__title { font-size: 13px; line-height: 1.6; }\n  .overlay__text { font-size: 8px; line-height: 2; max-width: none; }\n  .overlay__actions { gap: 10px; }\n  .btn-pixel { padding: 12px 16px; font-size: 9px; }\n\n  /* buchung */\n  .buchung-layout {\n    grid-template-columns: minmax(0, 1fr);\n    grid-template-rows: auto auto;\n    gap: 28px;\n    overflow: visible;\n  }\n  .buchung-info { display: block; overflow: visible; min-width: 0; }\n  .buchung-info__content { display: flex; overflow: visible; min-height: 0; min-width: 0; }\n  .buchung-info__logo { margin-top: 26px; }\n  .buchung-form-col { overflow: visible; padding: 0; min-width: 0; }\n  .disclaimer { width: auto; }\n\n  .field-grid { grid-template-columns: minmax(0, 1fr); gap: 20px; }\n  .slots__grid { grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); }\n  .submit-row { gap: 16px; }\n  .btn-solid, .btn-outline, const LEVELS = [\n  { ghosts: 1, gspeed: 74, pspeed: 100, fright: 7 },\n  { ghosts: 2, gspeed: 86, pspeed: 104, fright: 5 },\n  { ghosts: 3, gspeed: 98, pspeed: 108, fright: 3.5 },\n];\n\nconst MUG = [\".ff.\", \"faaf\", \"oaao\", \"oaao\", \".oo.\"];\nconst MUG_C = { f: \"#FFFFFF\", a: \"#F2A81B\", o: \"#5B3A16\" };\nconst FOOD = [\".bbb.\", \"b.b.b\", \"bbbbb\", \"b.b.b\", \".bbb.\"];\nconst FOOD_C = { b: \"#9B6428\" };\nconst BREZN = [\"..bbb..\", \".b.b.b.\", \"bbbbbbb\", \".bbbbb.\", \"..bbb..\"];\nconst BREZN_C = { b: \"#C1802F\" };\n\n/* table-block layout — shared by buildGrid() (collision) and renderBg() (art).\n   3 table rows x 4 table columns, matching the reference design 1:1. */\nconst TABLE_COLS = [[2, 5], [7, 10], [12, 15], [17, 20]];\nconst TABLE_ROWS = [[5, 6], [8, 9], [11, 12]];\n\n/* the two vendor-stall wall blocks flanking the dc-table goal alcove, rows 1-3.\n   Stalls run flush to the checkered border (cols 1 and 21) — no side corridor. */\nconst STALL_ROWS = [1, 3];\nconst STALL_COLS = [[1, 8], [14, 21]];\nconst GOAL_GAP_COLS = [9, 13];\nconst ALCOVE_X0 = GOAL_GAP_COLS[0] * TS + 2, ALCOVE_X1 = (GOAL_GAP_COLS[1] + 1) * TS - 2;\n\n/* decorative pretzel/heart icons stamped on select table-tops — cosmetic only,\n   tables are wall cells so this never touches pellet placement or collision */\nconst PRETZEL = [\"..bbb..\", \".b.b.b.\", \"bbbbbbb\", \".bbbbb.\", \"..bbb..\"];\nconst PRETZEL_C = { b: \"#4A2F14\" };\nconst PRETZEL_SALT = [\"...s...\", \"..s.s..\", \".s...s.\", \"..s.s..\", \"...s...\"];\nconst PRETZEL_SALT_C = { s: \"#F3EDE4\" };\nconst HEART = [\".ll.ll.\", \"l..l..l\", \"l.....l\", \".l...l.\", \"..l.l..\", \"...l...\"];\nconst HEART_C = { l: \"#D7FF24\" };\n\nconst TABLE_DECOR = { \"2,0\": \"heart\", \"1,1\": \"pretzel2\", \"3,2\": \"pretzel1\", \"0,2\": \"heart\" };\n\n/* ---------- DOM refs ---------- */\n\nconst pageSpiel = document.querySelector('.page--spiel');\nconst pageBuchung = document.querySelector('.page--buchung');\nconst canvas = document.getElementById('game-canvas');\nconst overlay = document.getElementById('overlay');\nconst overlayTitleEl = document.getElementById('overlay-title');\nconst overlayTextEl = document.getElementById('overlay-text');\nconst overlayBtn = document.getElementById('overlay-btn');\nconst overlayBookingBtn = document.getElementById('overlay-booking-btn');\nconst statScore = document.getElementById('stat-score');\nconst statLevel = document.getElementById('stat-level');\nconst statPicked = document.getElementById('stat-picked');\nconst statLives = document.getElementById('stat-lives');\nconst skipToBooking = document.getElementById('skip-to-booking');\n\nconst backToGame = document.getElementById('back-to-game');\nconst bookingForm = document.getElementById('booking-form');\nconst thankyou = document.getElementById('thankyou');\nconst thankyouText = document.getElementById('thankyou-text');\nconst btnAgain = document.getElementById('btn-again');\nconst fName = document.getElementById('f-name');\nconst fFirma = document.getElementById('f-firma');\nconst fMail = document.getElementById('f-mail');\nconst fNotiz = document.getElementById('f-notiz');\nconst slotsGrid = document.getElementById('slots-grid');\nconst slotHintEl = document.getElementById('slot-hint');\nconst btnSubmit = document.getElementById('btn-submit');\nconst submitSummary = document.getElementById('submit-summary');\n\n/* ============================================================\n   reactive state\n   ============================================================ */\n\nconst state = {\n  page: \"spiel\",\n  score: 0, level: 1, lives: 3, picked: 0, total: 0,\n  status: \"ready\", freigeschaltet: false,\n  name: \"\", firma: \"\", mail: \"\", gewaehlteSlots: [], notiz: \"\",\n  senden: \"offen\", fehler: \"\", slotUeber: false,\n};\n\n/* ============================================================\n   game engine\n   ============================================================ */\n\nconst game = {\n  ctx: null, bg: null, bgc: null, raf: null, last: 0, t: 0,\n  grid: null, pellets: null, total: 0, cfg: null,\n  player: null, ghosts: null, frightT: 0, bgDirty: true, open: false,\n  onKey: null,\n};\n\nfunction buildGrid() {\n  const g = [];\n  for (let y = 0; y < H; y++) g.push(new Array(W).fill(\"#\"));\n  for (let y = 1; y <= H - 4; y++) for (let x = 1; x <= 21; x++) g[y][x] = \" \";\n  STALL_COLS.forEach(([x0, x1]) => {\n    for (let y = STALL_ROWS[0]; y <= STALL_ROWS[1]; y++) for (let x = x0; x <= x1; x++) g[y][x] = \"#\";\n  });\n  TABLE_ROWS.forEach((b) => TABLE_COLS.forEach((t) => {\n    for (let y = b[0]; y <= b[1]; y++) for (let x = t[0]; x <= t[1]; x++) g[y][x] = \"#\";\n  }));\n  for (let x = GOAL_GAP_COLS[0]; x <= GOAL_GAP_COLS[1]; x++) g[H - 3][x] = \" \";\n  for (let x = 9; x <= 13; x++) g[H - 2][x] = \" \";\n  g[1][10] = \"G\"; g[1][11] = \"G\"; g[1][12] = \"G\";\n  return g;\n}\n\nfunction startLevel(level, score, lives) {\n  const cfg = LEVELS[Math.min(level, 3) - 1];\n  game.cfg = cfg;\n  game.grid = buildGrid();\n  game.pellets = new Map();\n  const coinX = [1, 6, 16, 21], coinY = [4, H - 5];\n  const power = [[1, 4], [21, 4], [1, H - 4], [21, H - 4]];\n  const ghostHome = [[11, 7], [6, 7], [16, 7]];\n  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {\n    if (game.grid[y][x] !== \" \") continue;\n    if (x === 11 && y === H - 2) continue;\n    if (y >= STALL_ROWS[0] && y <= STALL_ROWS[1] && x >= GOAL_GAP_COLS[0] && x <= GOAL_GAP_COLS[1]) continue;\n    if (ghostHome.slice(0, cfg.ghosts).some((h) => h[0] === x && h[1] === y)) continue;\n    let type = \"mug\";\n    if (coinX.includes(x) && coinY.includes(y)) type = \"food\";\n    if (power.some((p) => p[0] === x && p[1] === y)) type = \"power\";\n    game.pellets.set(x + \",\" + y, type);\n  }\n  game.total = game.pellets.size;\n  game.player = { tx: 11, ty: H - 2, dir: null, next: \"up\", prog: 0, speed: cfg.pspeed, mouth: 0 };\n  game.ghosts = ghostHome.slice(0, cfg.ghosts).map((h, i) => ({\n    tx: h[0], ty: h[1], home: h, dir: i === 0 ? \"left\" : \"right\", next: null, prog: 0,\n    speed: cfg.gspeed, fright: 0, jitter: 0.34 - level * 0.08,\n  }));\n  game.frightT = 0;\n  game.bgDirty = true;\n  game.open = false;\n  setState({ level, score, lives, picked: 0, total: game.total, status: \"ready\" });\n}\n\nfunction walkable(x, y) {\n  if (x < 0 || y < 0 || x >= W || y >= H) return false;\n  return game.grid[y][x] !== \"#\";\n}\n\nfunction setDir(dir) {\n  if (!game.player) return;\n  game.player.next = dir;\n  if (state.status === \"ready\") primary();\n}\n\nfunction advance(e, dt, decide) {\n  if (!e.dir) { decide(e); if (!e.dir) return; }\n  e.prog += (e.speed * dt) / TS;\n  let guard = 0;\n  while (e.prog >= 1 && guard++ < 8) {\n    e.prog -= 1;\n    const v = DIRV[e.dir];\n    e.tx += v[0]; e.ty += v[1];\n    if (e === game.player) eat(e.tx, e.ty);\n    decide(e);\n    if (!e.dir) { e.prog = 0; break; }\n  }\n}\n\nfunction decidePlayer(e) {\n  if (e.next && walkable(e.tx + DIRV[e.next][0], e.ty + DIRV[e.next][1])) { e.dir = e.next; e.next = null; return; }\n  if (!e.dir || !walkable(e.tx + DIRV[e.dir][0], e.ty + DIRV[e.dir][1])) e.dir = null;\n}\n\nfunction decideGhost(g) {\n  const opts = Object.keys(DIRV).filter((d) => {\n    if (g.dir && d === OPP[g.dir]) return false;\n    return walkable(g.tx + DIRV[d][0], g.ty + DIRV[d][1]);\n  });\n  const pool = opts.length ? opts : Object.keys(DIRV).filter((d) => walkable(g.tx + DIRV[d][0], g.ty + DIRV[d][1]));\n  if (!pool.length) { g.dir = null; return; }\n  if (Math.random() < g.jitter) { g.dir = pool[(Math.random() * pool.length) | 0]; return; }\n  const tx = game.player.tx, ty = game.player.ty;\n  let best = pool[0], bestD = Infinity;\n  pool.forEach((d) => {\n    const v = DIRV[d];\n    const nx = g.tx + v[0], ny = g.ty + v[1];\n    let dist = Math.hypot(nx - tx, ny - ty);\n    if (game.frightT > 0) dist = -dist;\n    if (dist < bestD) { bestD = dist; best = d; }\n  });\n  g.dir = best;\n}\n\nfunction px(e) { const v = e.dir ? DIRV[e.dir] : [0, 0]; return (e.tx + 0.5 + v[0] * e.prog) * TS; }\nfunction py(e) { const v = e.dir ? DIRV[e.dir] : [0, 0]; return (e.ty + 0.5 + v[1] * e.prog) * TS; }\n\nfunction eat(x, y) {\n  const k = x + \",\" + y;\n  const t = game.pellets.get(k);\n  if (!t) return;\n  game.pellets.delete(k);\n  game.bgDirty = true;\n  const gain = t === \"mug\" ? 10 : t === \"food\" ? 50 : 30;\n  if (t === \"power\") game.frightT = game.cfg.fright;\n  const picked = game.total - game.pellets.size;\n  if (game.pellets.size === 0) game.open = true;\n  setState({ score: state.score + gain, picked });\n}\n\nfunction tick(dt) {\n  game.t += dt;\n  if (state.status !== \"playing\") return;\n  if (game.frightT > 0) game.frightT = Math.max(0, game.frightT - dt);\n  const p = game.player;\n  p.mouth = (p.mouth + dt * 10) % 2;\n  advance(p, dt, decidePlayer);\n  game.ghosts.forEach((g) => {\n    g.speed = game.frightT > 0 ? game.cfg.gspeed * 0.55 : game.cfg.gspeed;\n    advance(g, dt, decideGhost);\n  });\n\n  if (game.open && game.grid[p.ty][p.tx] === \"G\") { clearLevel(); return; }\n\n  const pxx = px(p), pyy = py(p);\n  for (const g of game.ghosts) {\n    if (Math.hypot(px(g) - pxx, py(g) - pyy) > 15) continue;\n    if (game.frightT > 0) {\n      g.tx = g.home[0]; g.ty = g.home[1]; g.prog = 0; g.dir = null;\n      setState({ score: state.score + 200 });\n    } else {\n      hit();\n    }\n    return;\n  }\n}\n\nfunction hit() {\n  const lives = state.lives - 1;\n  game.player.tx = 11; game.player.ty = H - 2; game.player.dir = null; game.player.next = null; game.player.prog = 0;\n  game.ghosts.forEach((g) => { g.tx = g.home[0]; g.ty = g.home[1]; g.dir = null; g.prog = 0; });\n  game.frightT = 0;\n  if (lives <= 0) setState({ lives: 0, status: \"gameover\" });\n  else setState({ lives, status: \"hit\" });\n}\n\nfunction clearLevel() {\n  if (state.level >= 3) setState({ status: \"win\", freigeschaltet: true });\n  else setState({ status: \"levelclear\", freigeschaltet: true });\n}\n\nfunction primary() {\n  if (state.status === \"ready\" || state.status === \"hit\") { setState({ status: \"playing\" }); return; }\n  if (state.status === \"levelclear\") { startLevel(state.level + 1, state.score, state.lives); return; }\n  startLevel(1, 0, 3);\n}\n\n/* ---------- drawing ---------- */\n\nfunction sprite(ctx, cells, colors, cx, cy, s) {\n  const w = cells[0].length, h = cells.length;\n  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {\n    const c = colors[cells[y][x]];\n    if (!c) continue;\n    ctx.fillStyle = c;\n    ctx.fillRect(Math.round(cx - (w * s) / 2 + x * s), Math.round(cy - (h * s) / 2 + y * s), s, s);\n  }\n}\n\nfunction drawTableBlock(c, colIdx, rowIdx) {\n  const [tx0, tx1] = TABLE_COLS[colIdx], [ty0, ty1] = TABLE_ROWS[rowIdx];\n  const X0 = tx0 * TS, Y0 = ty0 * TS, X1 = (tx1 + 1) * TS, Y1 = (ty1 + 1) * TS;\n\n  const benchX0 = X0 + 5, benchX1 = X1 - 5, benchY0 = Y0 + 2, benchY1 = Y1 - 2;\n  c.fillStyle = \"#7E5525\";\n  c.fillRect(benchX0, benchY0, benchX1 - benchX0, benchY1 - benchY0);\n\n  const topX0 = X0 + 2, topX1 = X1 - 2, topY0 = Y0 + 8, topY1 = Y1 - 8;\n  c.fillStyle = \"#C79B62\";\n  c.fillRect(topX0, topY0, topX1 - topX0, topY1 - topY0);\n\n  const decor = TABLE_DECOR[colIdx + \",\" + rowIdx];\n  const cx = (topX0 + topX1) / 2, cy = (topY0 + topY1) / 2;\n  if (decor === \"pretzel2\") {\n    sprite(c, PRETZEL, PRETZEL_C, cx - 12, cy, 2);\n    sprite(c, PRETZEL_SALT, PRETZEL_SALT_C, cx - 12, cy, 2);\n    sprite(c, PRETZEL, PRETZEL_C, cx + 12, cy, 2);\n    sprite(c, PRETZEL_SALT, PRETZEL_SALT_C, cx + 12, cy, 2);\n  } else if (decor === \"pretzel1\") {\n    sprite(c, PRETZEL, PRETZEL_C, cx, cy, 2);\n    sprite(c, PRETZEL_SALT, PRETZEL_SALT_C, cx, cy, 2);\n  } else if (decor === \"heart\") {\n    sprite(c, HEART, HEART_C, cx, cy, 2);\n  }\n}\n\nfunction drawBuntingStrip(c, xTile0, xTile1, yPix) {\n  const xStart = xTile0 * TS + 4, xEnd = (xTile1 + 1) * TS - 4;\n  const span = xEnd - xStart, sag = 5;\n  const stringY = (x) => {\n    const t = (x - xStart) / span;\n    return yPix + sag * 4 * t * (1 - t);\n  };\n\n  c.strokeStyle = \"#2B1C10\";\n  c.lineWidth = 1;\n  c.beginPath();\n  const steps = 24;\n  for (let i = 0; i <= steps; i++) {\n    const x = xStart + (span * i) / steps;\n    const y = stringY(x);\n    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);\n  }\n  c.stroke();\n\n  const flagW = 8, gap = 3;\n  let x = xStart;\n  while (x + flagW <= xEnd) {\n    c.fillStyle = \"#D7FF24\";\n    c.beginPath();\n    c.moveTo(x, stringY(x));\n    c.lineTo(x + flagW, stringY(x + flagW));\n    c.lineTo(x + flagW / 2, stringY(x + flagW / 2) + 6);\n    c.closePath();\n    c.fill();\n    x += flagW + gap;\n  }\n}\n\n/* shared vertical geometry of a stall block, so the goal-alcove table can align\n   its top edge with the middle of the stalls' counter surface */\nfunction stallGeometry() {\n  const Y0 = STALL_ROWS[0] * TS, Y1 = (STALL_ROWS[1] + 1) * TS;\n  const h = Y1 - Y0, canopyH = Math.round(h * 0.38);\n  const inset = 3, cy0 = Y0 + canopyH + 2, ch = Y1 - cy0 - inset;\n  return { Y0, Y1, canopyH, counterY0: cy0, counterH: ch, counterCenterY: cy0 + ch / 2 };\n}\n\n/* vendor-stall wall block: canopy + bunting on top, counter with icons below */\nfunction drawStallBlock(c, x0, x1) {\n  const { Y0, Y1, canopyH, counterY0, counterH } = stallGeometry();\n  let X0 = x0 * TS, X1 = (x1 + 1) * TS;\n  if (X1 <= ALCOVE_X0) X1 = ALCOVE_X0; // close the seam against the goal alcove\n  if (X0 >= ALCOVE_X1) X0 = ALCOVE_X1;\n  const w = X1 - X0, h = Y1 - Y0;\n\n  c.fillStyle = \"#4A3320\";\n  c.fillRect(X0, Y0, w, h);\n  c.fillStyle = \"#5C3D1E\";\n  c.fillRect(X0, Y0, w, canopyH);\n  c.fillStyle = \"#C79B62\";\n  c.fillRect(Math.round(X0 + w * 0.28) - 2, Y0, 4, canopyH + 5);\n  c.fillRect(Math.round(X0 + w * 0.72) - 2, Y0, 4, canopyH + 5);\n  drawBuntingStrip(c, x0, x1, Y0 + 4);\n\n  const inset = 3;\n  c.fillStyle = \"#5C3D1E\";\n  c.fillRect(X0 + inset - 1, counterY0 - 1, w - inset * 2 + 2, counterH + 2);\n  c.fillStyle = \"#C79B62\";\n  c.fillRect(X0 + inset, counterY0, w - inset * 2, counterH);\n\n  const cx = X0 + w / 2, cyc = counterY0 + counterH / 2;\n  sprite(c, PRETZEL, PRETZEL_C, X0 + w * 0.22, cyc, 2);\n  sprite(c, PRETZEL_SALT, PRETZEL_SALT_C, X0 + w * 0.22, cyc, 2);\n  sprite(c, HEART, HEART_C, cx, cyc, 2);\n  sprite(c, PRETZEL, PRETZEL_C, X0 + w * 0.78, cyc, 2);\n  sprite(c, PRETZEL_SALT, PRETZEL_SALT_C, X0 + w * 0.78, cyc, 2);\n}\n\n/* the dc-table goal alcove between the two stalls — reached once every pellet is picked up.\n   The table's top edge lines up with the vertical middle of the stalls' counters. */\nfunction drawGoalSign(c) {\n  const { Y1, counterCenterY } = stallGeometry();\n  const x0 = ALCOVE_X0, x1 = ALCOVE_X1, y0 = STALL_ROWS[0] * TS + 2, y1 = Y1 - 2;\n  c.fillStyle = \"#2A1B0F\";\n  c.fillRect(x0, y0, x1 - x0, y1 - y0);\n\n  const d = [\"0001\", \"0111\", \"1101\", \"1101\", \"0111\"];\n  const cl = [\"0111\", \"1000\", \"1000\", \"0111\"];\n  const dScale = 4, cScale = 4, letterGap = 5;\n  const textY = y0 + (counterCenterY - y0) * 0.55;\n  const dCenterX = 11 * TS;\n  const dRightEdge = dCenterX + (4 * dScale) / 2;\n  const cCenterX = dRightEdge + letterGap + (4 * cScale) / 2;\n  const cCenterY = textY + (5 * dScale) / 2 - (cl.length * cScale) / 2; // baseline-align \"c\" under \"d\"\n  sprite(c, d, { 1: \"#D7FF24\" }, dCenterX, textY, dScale);\n  sprite(c, cl, { 1: \"#D7FF24\" }, cCenterX, cCenterY, cScale);\n\n  const alcoveCenterX = (x0 + x1) / 2;\n  const tableW = (x1 - x0) * (2 / 3);\n  const tableX0 = alcoveCenterX - tableW / 2, tableX1 = alcoveCenterX + tableW / 2;\n  const tableTopY = counterCenterY, legW = 2, legInset = 3;\n  c.fillStyle = \"#5C3D1E\";\n  c.fillRect(tableX0, tableTopY, tableW, 6);\n  c.fillRect(tableX0 + legInset, tableTopY + 6, legW, y1 - 2 - (tableTopY + 6));\n  c.fillRect(tableX1 - legInset - legW, tableTopY + 6, legW, y1 - 2 - (tableTopY + 6));\n}\n\nfunction renderBg() {\n  const c = game.bgc;\n  c.fillStyle = \"#3A2717\";\n  c.fillRect(0, 0, game.bg.width, game.bg.height);\n  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {\n    const X = x * TS, Y = y * TS, cell = game.grid[y][x];\n    if (cell === \"#\") {\n      const border = x === 0 || y === 0 || x === W - 1 || y >= H - 3;\n      if (border) {\n        const q = TS / 2;\n        for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {\n          c.fillStyle = (x + y + i + j) % 2 ? \"#1E5FA8\" : \"#EEF1F4\";\n          c.fillRect(X + i * q, Y + j * q, q, q);\n        }\n      }\n      /* non-border wall cells (stalls/tables) are painted as whole blocks below */\n      continue;\n    }\n    c.fillStyle = (y % 2) ? \"#4A3320\" : \"#443021\";\n    c.fillRect(X, Y, TS, TS);\n    c.fillStyle = \"rgba(0,0,0,0.14)\";\n    c.fillRect(X, Y + TS - 1, TS, 1);\n  }\n\n  STALL_COLS.forEach(([x0, x1]) => drawStallBlock(c, x0, x1));\n  TABLE_ROWS.forEach((_, rowIdx) => TABLE_COLS.forEach((_, colIdx) => drawTableBlock(c, colIdx, rowIdx)));\n  drawGoalSign(c);\n\n  game.pellets.forEach((t, k) => {\n    if (t === \"power\") return;\n    const p = k.split(\",\"), x = (+p[0] + 0.5) * TS, y = (+p[1] + 0.5) * TS;\n    if (t === \"mug\") sprite(c, MUG, MUG_C, x, y, 2);\n    else sprite(c, FOOD, FOOD_C, x, y, 2);\n  });\n  game.bgDirty = false;\n}\n\nfunction drawPlayer(ctx) {\n  const p = game.player, r = 9;\n  const cx = px(p), cy = py(p);\n  const openAmt = p.dir ? Math.abs(Math.sin(game.t * 9)) * 0.9 : 0.25;\n  const base = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[p.dir || \"up\"];\n  ctx.fillStyle = \"#F2C21B\";\n  for (let y = -r; y <= r; y += 2) for (let x = -r; x <= r; x += 2) {\n    if (x * x + y * y > r * r) continue;\n    let a = Math.atan2(y, x) - base;\n    a = Math.atan2(Math.sin(a), Math.cos(a));\n    if (Math.abs(a) < openAmt * 0.75) continue;\n    ctx.fillRect(Math.round(cx + x), Math.round(cy + y), 2, 2);\n  }\n  ctx.fillSty AAAAAAAAAAAREInAAAAAAAAAAAAAAAAAAAAAACASOgEAAAAAAAAAAAAAAAAAAAAAAAQCZ0AAAAAAAAAAAAAAAAAAAAAAAAioRMAAAAAAAAAAAAAAAAAAAAAAEAkdAIAAAAAAAAAAAAAAAAAAAAAAIiETgAAAAAAAAAAAAAAAAAAAAAAAJHQCQAAAAAAAAAAAAAAAAAAAAAAIBI6AQAAAAAAAAAAAAAAAAAAAAAAREInAAAAAAAAAAAAAAAAAAAAAACASOgEAAAAAAAAAAAAAAAAAAAAAAAQCZ0AAAAAAAAAAAAAAAAAAAAAAAAioRMAAAAAAAAAAAAAAAAAAAAAAEAkdAIAAAAAAAAAAAAAAAAAAAAAAIiETgAAAAAAAAAAAAAAAAAAAAAAAJHQCQAAAAAAAAAAAAAAAAAAAAAAIBI6AQAAAAAAAAAAAAAAAAAAAAAAREInAAAAAAAAAAAAAAAAAAAAAACASOgEAAAAAAAAAAAAAAAAAAAAAAAQCZ0AAAAAAAAAAAAAAAAAAAAAAAAioRMAAAAAAAAAAAAAAAAAAAAAAEAkdAIAAAAAAAAAAAAAAAAAAAAAAIiETgAAAAAAAAAAAAAAAAAAAAAAAJHQCQAAAAAAAAAAAAAAAAAAAAAAIBI6AQAAAAAAAAAAAAAAAAAAAAAAREInAAAAAAAAAAAAAAAAAAAAAACASOgEAAAAAAAAAAAAAAAAAAAAAAAQCZ0AAAAAAAAAAAAAAAAAAAAAAAAioRMAAAAAAAAAAAAAAAAAAAAAAEAkdAIAAAAAAAAAAAAAAAAAAAAAAIiETgAAAAAAAAAAAAAAAAAAAAAAAJHQCQAAAAAAAAAAAAAAAAAAAAAAIBI6AQAAAAAAAAAAAAAAAAAAAAAAREInAAAAAAAAAAAAAAAAAAAAAACASOgEAAAAAAAAAAAAAAAAAAAAAAAQCZ0AAAAAAAAAAAAAAAAAAAAAAAAioRMAAAAAAAAAAAAAAAAAAAAAAMCaA8ZDwheivB2nAAAAAElFTkSuQmCC';\n    h.alt = '';\n    h.className = 'life-heart' + (i < s.lives ? '' : ' is-spent');\n    statLives.appendChild(h);\n  }\n\n  const showOverlay = s.status !== \"playing\";\n  overlay.hidden = !showOverlay;\n  if (showOverlay && copy) {\n    overlayTitleEl.textContent = copy.t;\n    overlayTextEl.textContent = copy.x;\n    overlayBtn.textContent = copy.b;\n  }\n  overlayBookingBtn.hidden = !(s.freigeschaltet && showOverlay);\n}\n\n/* ============================================================\n   view: booking form\n   ============================================================ */\n\nfunction fmtHour(h) { return Math.floor(h) + \".\" + (h % 1 === 0.5 ? \"30\" : \"00\"); }\n\nconst SLOT_STARTS = [10, 10.5, 11, 11.5, 12, 12.5, 13, 13.5, 14, 14.5, 15, 15.5];\nconst SLOT_LABELS = SLOT_STARTS.map((h) => fmtHour(h) + \"–\" + fmtHour(h + 1));\n\nfunction buildSlotButtons() {\n  slotsGrid.innerHTML = \"\";\n  SLOT_LABELS.forEach((label) => {\n    const btn = document.createElement('button');\n    btn.type = 'button';\n    btn.className = 'slot-btn';\n    btn.textContent = label;\n    btn.addEventListener('click', () => toggleSlot(label));\n    slotsGrid.appendChild(btn);\n  });\n}\n\nfunction toggleSlot(label) {\n  const gewaehlt = state.gewaehlteSlots;\n  if (gewaehlt.includes(label)) {\n    setState({ gewaehlteSlots: gewaehlt.filter((x) => x !== label), fehler: \"\", slotUeber: false });\n    return;\n  }\n  if (gewaehlt.length >= 3) { setState({ slotUeber: true }); return; }\n  setState({ gewaehlteSlots: [...gewaehlt, label], fehler: \"\", slotUeber: false });\n}\n\nfunction renderBuchungView() {\n  const s = state;\n  const gewaehlt = s.gewaehlteSlots;\n\n  [...slotsGrid.children].forEach((btn, i) => {\n    btn.classList.toggle('is-active', gewaehlt.includes(SLOT_LABELS[i]));\n  });\n\n  const slotHint = gewaehlt.length === 0\n    ? \"Bis zu drei Zeitfenster wählen — Felder mehrfach anklicken.\"\n    : gewaehlt.length < 3\n      ? gewaehlt.length + \" von 3 Zeitfenstern gewählt.\"\n      : \"3 von 3 Zeitfenstern gewählt. Reicht die Zeit nicht — kurze Mail an wiesn@designcompany.de.\";\n  slotHintEl.textContent = slotHint;\n  slotHintEl.classList.toggle('is-warn', s.slotUeber);\n\n  const teile = [];\n  if (gewaehlt.length) teile.push(gewaehlt.join(\" / \"));\n  if (s.name) teile.push(s.name);\n  const zus = s.fehler ? s.fehler : teile.join(\" · \");\n  submitSummary.textContent = zus;\n  submitSummary.classList.toggle('is-error', !!s.fehler);\n\n  btnSubmit.textContent = s.senden === \"laeuft\" ? \"Wird gesendet…\" : \"Anmeldung senden\";\n  btnSubmit.disabled = s.senden === \"laeuft\";\n\n  const istGesendet = s.senden === \"fertig\";\n  thankyou.hidden = !istGesendet;\n  bookingForm.hidden = istGesendet;\n  if (istGesendet) {\n    thankyouText.textContent = \"Deine Wunschzeit am dc Wiesntisch, \" + gewaehlt.join(\" / \") + \", ist bei uns eingegangen.\\nIn kürze bekommst du eine Bestätigung per E-Mail.\";\n  }\n}\n\nfunction absenden(e) {\n  e.preventDefault();\n  const s = state;\n  if (s.senden === \"laeuft\") return;\n  if (!s.name.trim()) return setState({ fehler: \"Bitte einen Namen eintragen.\" });\n  if (!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(s.mail.trim())) return setState({ fehler: \"Bitte eine gültige E-Mail-Adresse eintragen.\" });\n  if (!s.gewaehlteSlots.length) return setState({ fehler: \"Bitte mindestens ein Zeitfenster wählen.\" });\n\n  const ankunft = s.gewaehlteSlots.join(\", \") + (s.notiz.trim() ? \" — \" + s.notiz.trim() : \"\");\n  const data = new FormData();\n  data.append(\"entry.1811010876\", s.name.trim());\n  data.append(\"entry.1750704611\", s.firma.trim());\n  data.append(\"entry.1848850656\", s.mail.trim());\n  data.append(\"entry.1923405211\", \"1\");\n  data.append(\"entry.134656664\", ankunft);\n\n  setState({ senden: \"laeuft\", fehler: \"\" });\n  fetch(FORM_URL, { method: \"POST\", mode: \"no-cors\", body: data })\n    .then(() => setState({ senden: \"fertig\" }))\n    .catch(() => setState({ senden: \"offen\", fehler: \"Senden hat nicht geklappt. Bitte kurz an wiesn@designcompany.de schreiben.\" }));\n}\n\nfunction nochEine() {\n  setState({ senden: \"offen\", fehler: \"\", name: \"\", firma: \"\", mail: \"\", gewaehlteSlots: [], notiz: \"\", slotUeber: false });\n  fName.value = \"\"; fFirma.value = \"\"; fMail.value = \"\"; fNotiz.value = \"\";\n}\n\n/* ============================================================\n   state + page routing\n   ============================================================ */\n\nfunction setState(patch) {\n  Object.assign(state, patch);\n  render();\n}\n\nfunction render() {\n  renderSpielView();\n  renderBuchungView();\n}\n\nfunction goto(page) {\n  if (state.page === page) return;\n  if (page === \"buchung\") stopGame();\n  state.page = page;\n  pageSpiel.hidden = page !== \"spiel\";\n  pageBuchung.hidden = page !== \"buchung\";\n  if (page === \"spiel\") initGame();\n  window.scrollTo(0, 0);\n}\n\n/* ============================================================\n   wire up\n   ============================================================ */\n\ndocument.querySelectorAll('.dpad__btn').forEach((btn) => {\n  btn.addEventListener('click', () => setDir(btn.dataset.dir));\n});\noverlayBtn.addEventListener('click', primary);\noverlayBookingBtn.addEventListener('click', () => goto('buchung'));\nskipToBooking.addEventListener('click', () => goto('buchung'));\nbackToGame.addEventListener('click', () => goto('spiel'));\n\nfName.addEventListener('input', () => setState({ name: fName.value }));\nfFirma.addEventListener('input', () => setState({ firma: fFirma.value }));\nfMail.addEventListener('input', () => setState({ mail: fMail.value }));\nfNotiz.addEventListener('input', () => setState({ notiz: fNotiz.value }));\nbookingForm.addEventListener('submit', absenden);\nbtnAgain.addEventListener('click', nochEine);\n\nbuildSlotButtons();\nrender();\ninitGame();\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
